<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Bacon &mdash; Dr. Peter Park</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f8f9fa;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 40px 20px;
    }
    .container {
      max-width: 1000px; width: 100%;
      display: flex; gap: 30px; align-items: center; justify-content: center;
      flex-wrap: wrap;
    }
    .container img {
      max-width: 100%;
      max-height: 80vh;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 6px 22px rgba(0,0,0,0.2);
    }
    .logo, .pig { flex: 0 1 420px; }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="teambacon.jpg" alt="Team Bacon logo">
    <img class="pig" src="dr-park-team-bacon.jpg" alt="Dr. Park with a feral pig">
  </div>
</body>
</html>
