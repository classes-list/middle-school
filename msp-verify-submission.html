<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Check a Submission — Dr. Park</title>
<style>
body{font-family:-apple-system,Segoe UI,Arial,sans-serif;background:#f1f5f9;color:#1f2a36;margin:0;padding:24px}
.card{max-width:760px;margin:0 auto;background:#fff;border-radius:12px;padding:22px 24px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h1{font-size:1.4rem;margin:0 0 6px;color:#0b3c5d}p{margin:6px 0 12px;color:#475569}
textarea{width:100%;box-sizing:border-box;height:320px;border:1.5px solid #cbd5e1;border-radius:8px;padding:10px;font:13px/1.4 ui-monospace,Menlo,monospace}
button{margin-top:10px;padding:10px 18px;border:0;border-radius:8px;background:#0b3c5d;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
button.alt{background:#e2e8f0;color:#334155;margin-left:6px}
#out{margin-top:14px;padding:14px 16px;border-radius:8px;font-weight:700;display:none}
.ok{background:#dcfce7;color:#14532d;border:1.5px solid #16a34a}.bad{background:#fee2e2;color:#7f1d1d;border:1.5px solid #dc2626}.warn{background:#fef9c3;color:#713f12;border:1.5px solid #ca8a04}
</style></head><body><div class="card">
<h1>🔎 Check a Submission</h1>
<p>Open the student's email, select all of the text in the message (Cmd+A inside the message, or drag from the top of the email to the Verification code line), copy it, and paste it below.</p>
<textarea id="t" placeholder="Paste the whole email here…"></textarea>
<div><button onclick="verify()">Check</button><button class="alt" onclick="document.getElementById('t').value='';out.style.display='none'">Clear</button></div>
<div id="out"></div>
</div>
<script>
var SALT='msos-ppark-verify-2026';
function h(str,seed){var h1=0xdeadbeef^(seed||0),h2=0x41c6ce57^(seed||0);for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}
function norm(t){return String(t).normalize('NFKC').toLowerCase().replace(/[−–—]/g,'-').replace(/[^a-z0-9✓✗.\-\/%^]/g,'');}
function code(t){var s=h(SALT+norm(t)).toString(36).toUpperCase();while(s.length<10)s='0'+s;s=s.slice(-10);return s.slice(0,5)+'-'+s.slice(5);}
window.__pparkCode=code;
var out=document.getElementById('out');
function show(cls,html){out.className=cls;out.innerHTML=html;out.style.display='block';}
function verify(){
  var lines=document.getElementById('t').value.replace(/\r/g,'').split('\n');
  var idx=-1,given='';
  for(var i=lines.length-1;i>=0;i--){var m=lines[i].match(/Verification code:\s*([A-Z0-9]{5}-[A-Z0-9]{5})/i);if(m){idx=i;given=m[1].toUpperCase();break;}}
  if(idx<0){show('warn','⚠️ No verification code found. The email may be from before codes were added (submissions sent before this update), or the code line was deleted.');return;}
  for(var s=0;s<idx;s++){var body=lines.slice(s,idx).join('\n').replace(/\s+$/,'');if(code(body)===given){show('ok','✅ Verified. The score and answers match what the test page produced. Nothing was changed.');return;}}
  show('bad','❌ Does not match. Something in this email was changed after the test page created it (for example an answer, a ✓/✗ mark, or the score). Compare it with the student, or have them retake.');
}
</script></body></html>
